name: Terraform Validate

# fmt and validate, as a pull-request check.
#
# Runs on pull_request rather than on every push: a push-triggered run fired on
# every commit, which is a lot of workflow noise for a check whose result only
# matters when somebody is about to review the change.
#
# It is NOT redundant with the plan jobs, even though those also run validate.
# In _terraform-plan.yml the validate step is guarded by the state-backend check,
# so for any environment that has not been bootstrapped the plan job SKIPS it. If
# no backend exists yet, this workflow is the only thing validating the code at
# all.
#
# Deliberately needs NO Azure credentials and NO state access:
# "terraform init -backend=false" is enough for validate, so it is safe on a
# branch opened by someone without deployment rights, and it finishes in seconds.

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - "bootstrap/**"
      - ".github/workflows/terraform-*.yml"
      - ".github/workflows/_terraform-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Terraform format
        id: fmt
        run: |
          if terraform fmt -check -recursive; then
            echo "All files are correctly formatted."
          else
            echo "::error::Formatting issues above. Run 'terraform fmt -recursive' and commit."
            exit 1
          fi

      # Each root is validated separately. -backend=false skips backend setup,
      # which validate does not need -- so no credentials and no state are
      # touched. Modules are validated through the roots that call them.
      - name: Terraform validate
        run: |
          set -uo pipefail
          FAILED=0
          for dir in environments/dev environments/test environments/prod bootstrap/state baytex-bi-owned-unity-catalog-example; do
            [ -d "$dir" ] || continue
            echo "::group::validate $dir"
            if terraform -chdir="$dir" init -backend=false -input=false >/dev/null 2>&1 \
               && terraform -chdir="$dir" validate -no-color; then
              echo "  OK"
            else
              echo "::error::terraform validate failed in $dir"
              terraform -chdir="$dir" validate -no-color || true
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED

      - name: Summary
        if: always()
        run: |
          {
            echo "### Terraform validate"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "fmt and validate passed on \`${{ github.ref_name }}\`."
            else
              echo "Failures above on \`${{ github.ref_name }}\` — fix before opening a pull request."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
