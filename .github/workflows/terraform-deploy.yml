name: Terraform Deploy

# Manual deployment with an enforced promotion order: dev -> test -> prod.
#
# Environments are CHECKBOXES, so any combination can be run -- dev alone, test
# and prod together, all three. Order is still enforced for whatever is ticked:
# if dev and prod are both selected, prod waits for dev to apply successfully.
# An environment that is NOT ticked simply drops out of the chain rather than
# blocking the ones after it, which is what "!inputs.dev ||" expresses below.
#
# Ticking everything runs the full chain and STOPS at the first failure, so test
# is only reached once dev has actually applied, and prod only once test has.
#
# Gating: each apply job targets the "<env>-apply" GitHub Environment. Attach
# required reviewers to test-apply and prod-apply and the run pauses there for
# sign-off. (Protection rules need GitHub Pro/Team/Enterprise on a private repo;
# until then the gate is that a human chooses to run this workflow.)

on:
  workflow_dispatch:
    inputs:
      dev:
        description: dev
        type: boolean
        default: true
      test:
        description: test
        type: boolean
        default: false
      prod:
        description: prod
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# Shared with terraform-destroy.yml so a deploy and a destroy can never run at
# the same time and fight over the state lock. A deploy can span all three
# environments, so this cannot be scoped per environment -- and serialising
# mutating runs is the safe trade. Plans are cheap to redo; applies are not.
concurrency:
  group: terraform-mutate
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------- dev
  dev-plan:
    if: inputs.dev
    uses: ./.github/workflows/_terraform-plan.yml
    with:
      environment: dev
    secrets: inherit

  dev-apply:
    needs: dev-plan
    uses: ./.github/workflows/_terraform-apply.yml
    with:
      environment: dev
    secrets: inherit

  # ---------------------------------------------------------------- test
  # always() is required because on a single-environment run the dev jobs are
  # SKIPPED, and a skipped dependency would otherwise skip everything downstream.
  test-plan:
    needs: dev-apply
    if: >-
      always() && inputs.test && (
        !inputs.dev || needs.dev-apply.result == 'success'
      )
    uses: ./.github/workflows/_terraform-plan.yml
    with:
      environment: test
    secrets: inherit

  test-apply:
    needs: test-plan
    if: always() && needs.test-plan.result == 'success'
    uses: ./.github/workflows/_terraform-apply.yml
    with:
      environment: test
    secrets: inherit

  # ---------------------------------------------------------------- prod
  # prod needs BOTH earlier stages in its needs list, not just test. With only
  # dev and prod ticked, test drops out -- and if prod were gated on test alone,
  # "!inputs.test" would be true and prod would deploy even after dev had FAILED.
  # Each stage is therefore gated on every earlier stage that was actually ticked.
  prod-plan:
    needs: [dev-apply, test-apply]
    if: >-
      always() && inputs.prod
      && (!inputs.dev || needs.dev-apply.result == 'success')
      && (!inputs.test || needs.test-apply.result == 'success')
    uses: ./.github/workflows/_terraform-plan.yml
    with:
      environment: prod
    secrets: inherit

  prod-apply:
    needs: prod-plan
    if: always() && needs.prod-plan.result == 'success'
    uses: ./.github/workflows/_terraform-apply.yml
    with:
      environment: prod
    secrets: inherit
