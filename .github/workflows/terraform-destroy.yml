name: Terraform Destroy Platform

# Tears down the platform in one or more environments.
#
# Scope: the platform roots only (environments/<env>). The state backend is NOT destroyed, so an environment can be
# rebuilt with Terraform Deploy Platform without bootstrapping again - and the state account holds the very state file
# this run writes to, so destroying it from here would be self-defeating.
#
# Not destroyed, because this Terraform never owned them:
#   - the hub VNet, firewall and on-premises systems
#   - the HUB SIDE of the VNet peering, which is customer-owned
# The apply job reports the exact command for the hub-side peering.
#
# Two guards before anything is touched:
#   1. main only. Deploys may run from a hotfix branch; a teardown may not.
#      Removing an environment is never the urgent action a hotfix exists for,
#      so it must come from reviewed, merged code.
#   2. The ticked environments have to be retyped exactly.
#
# The structure matches Terraform Deploy Platform - plan in <env>-plan, apply in <env>-apply - so required reviewers
# attached to <env>-apply gate a destroy the same way they gate a deployment, with the full destroy plan already
# published for them to read.

on:
  workflow_dispatch:
    inputs:
      dev:
        description: dev
        type: boolean
        default: false
      test:
        description: test
        type: boolean
        default: false
      prod:
        description: prod
        type: boolean
        default: false
      confirm:
        description: "Retype the ticked environments exactly, comma-separated, e.g. dev,prod"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# Shared with Terraform Deploy Platform - see the note there. A destroy must never overlap a deploy.
concurrency:
  group: terraform-mutate
  cancel-in-progress: false

jobs:
  preflight:
    name: Check the run is allowed
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      environments: ${{ steps.resolve.outputs.environments }}
      selected: ${{ steps.resolve.outputs.selected }}
    steps:
      - name: Check the branch is allowed to destroy
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Refusing to destroy from '${{ github.ref }}'. Destroys run from main only."
            exit 1
          fi
          echo "Destroying from ${{ github.ref }}"

      # The order is fixed dev,test,prod regardless of which boxes were ticked, so the string an operator has to retype
      # is unambiguous. Comparing against the resolved list rather than a fixed word means they have to have read what
      # they actually selected.
      - name: Resolve and confirm the selected environments
        id: resolve
        run: |
          set -euo pipefail
          SELECTED=""
          add () { if [ -z "$SELECTED" ]; then SELECTED="$1"; else SELECTED="$SELECTED,$1"; fi; }
          [ "${{ inputs.dev }}"  = "true" ] && add dev
          [ "${{ inputs.test }}" = "true" ] && add test
          [ "${{ inputs.prod }}" = "true" ] && add prod

          if [ -z "$SELECTED" ]; then
            echo "::error::No environment selected. Tick at least one of dev, test or prod."
            exit 1
          fi

          if [ "${{ inputs.confirm }}" != "$SELECTED" ]; then
            echo "::error::Confirmation '${{ inputs.confirm }}' does not match the selected environments '$SELECTED'. Nothing was destroyed."
            {
              echo "### Destroy refused"
              echo ""
              echo "| | |"
              echo "| --- | --- |"
              echo "| Ticked | \`$SELECTED\` |"
              echo "| Typed | \`${{ inputs.confirm }}\` |"
              echo "| Required | the ticked environments, comma-separated, in the order dev,test,prod |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          JSON="[\"$(printf '%s' "$SELECTED" | sed 's/,/","/g')\"]"
          echo "environments=$JSON" >> "$GITHUB_OUTPUT"
          echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"
          echo "Confirmed. Destroying: $SELECTED  ->  $JSON"

          {
            echo "### Destroy requested"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Environments | \`$SELECTED\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Before approving | read the destroy plan produced for each environment |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Environments are independent, so one failing does not abandon the others.
  plan:
    name: Plan ${{ matrix.environment }} platform teardown
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.preflight.outputs.environments) }}
    uses: ./.github/workflows/_terraform-plan.yml
    with:
      environment: ${{ matrix.environment }}
      operation: destroy
      save_plan: true
    secrets: inherit

  # The apply legs wait for every plan leg, not just their own - GitHub does not pair matrix legs across jobs. If any
  # environment fails to plan, nothing is destroyed: a clean stop is easier to reason about mid-teardown than a partial
  # one, and re-running after fixing the cause costs only the plan again.
  apply:
    name: Apply ${{ matrix.environment }} platform teardown
    needs: [preflight, plan]
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.preflight.outputs.environments) }}
    uses: ./.github/workflows/_terraform-apply.yml
    with:
      environment: ${{ matrix.environment }}
      operation: destroy
      allowed_refs: refs/heads/main
    secrets: inherit
