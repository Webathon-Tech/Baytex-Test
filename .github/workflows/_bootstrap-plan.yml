name: Reusable - Bootstrap Plan

# Plans the Azure Blob state backend for one environment.
#
# This root is unlike the platform roots in one important way: the storage account it manages HOLDS THE STATE FOR EVERY
# ENVIRONMENT. A change that forced replacement of that account would destroy the state it is tracked in. That is why
# the bootstrap has the same gated plan/apply split as a deployment - a reviewer must see the plan before anything is
# applied.
#
# There is also a chicken-and-egg problem: Terraform cannot keep state in a storage account that does not exist yet. The
# first run therefore works with local state, creates the account, and migrates. Later runs go straight to the remote
# backend. Which of those applies is decided here and passed to the apply job in the artefact, so the apply performs
# exactly the sequence that was reviewed.
#
# The decision looks at the STATE BLOB, not just the storage account. If an earlier run created the account but stopped
# before migrating, checking only the account would take the "remote" path against an empty backend, and Terraform would
# then try to create a storage account whose name is already taken. Importing recovers from that cleanly.

on:
  workflow_call:
    inputs:
      environment:
        description: Environment whose state backend is being planned (dev / test / prod).
        required: true
        type: string
      save_plan:
        description: >-
          Upload the binary plan so the apply job can consume it. false produces a
          human-readable plan for review only, and nothing can apply it - used by
          the pull-request checks.
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-plan
    defaults:
      run:
        shell: bash
        working-directory: bootstrap/${{ inputs.environment }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ARM_USE_AZUREAD: "true"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Runs before the Azure sign-in, because that is what breaks first. An environment whose service principal does
      # not exist yet has no AZURE_CLIENT_ID, and azure/login then fails with an authentication error that says nothing
      # about the real cause.
      #
      # test and prod are normally configured later than dev - their service principals are created only once dev has
      # been verified - so a pull-request plan for them has to report "not configured yet" rather than a red failure
      # that people learn to ignore.
      #
      # A real bootstrap run still fails here: it names an environment explicitly, so missing configuration is a genuine
      # error.
      - name: Check the environment is configured
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          STATE_RG: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
          BOOTSTRAP_TFVARS: ${{ vars.BOOTSTRAP_TFVARS }}
        run: |
          set -uo pipefail
          MISSING=""
          need () { [ -n "${2:-}" ] || MISSING="$MISSING $1"; }
          need AZURE_CLIENT_ID          "${AZURE_CLIENT_ID:-}"
          need AZURE_TENANT_ID          "${AZURE_TENANT_ID:-}"
          need AZURE_SUBSCRIPTION_ID    "${AZURE_SUBSCRIPTION_ID:-}"
          need TF_STATE_RESOURCE_GROUP  "${STATE_RG:-}"
          need TF_STATE_STORAGE_ACCOUNT "${STATE_SA:-}"
          need TF_STATE_CONTAINER       "${STATE_CONTAINER:-}"
          need BOOTSTRAP_TFVARS         "${BOOTSTRAP_TFVARS:-}"

          if [ -z "$MISSING" ]; then
            echo "Environment ${{ inputs.environment }} is configured."
            exit 0
          fi

          if [ "${{ inputs.save_plan }}" = "true" ]; then
            echo "::error::Environment '${{ inputs.environment }}' is not configured. Missing:$MISSING. Create its service principal and set these variables on the ${{ inputs.environment }}-plan and ${{ inputs.environment }}-apply GitHub Environments - see GITHUB-SETUP.md."
            exit 1
          fi

          echo "SKIP=true" >> "$GITHUB_ENV"
          echo "::notice::Skipping ${{ inputs.environment }} state backend - not configured yet (missing:$MISSING)."

      - name: Sign in to Azure with OIDC
        if: env.SKIP != 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        if: env.SKIP != 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Runs before terraform.tfvars is written, so the formatting gate reports on repository code rather than on the
      # content of a GitHub variable.
      #
      # Scoped to the code this pipeline deploys. "terraform fmt" takes a single
      # target, so the deployed paths are walked in turn.
      - name: Check Terraform formatting
        if: env.SKIP != 'true'
        working-directory: .
        run: |
          set -uo pipefail
          FAILED=0

          for dir in environments/dev environments/test environments/prod \
                     bootstrap/dev bootstrap/test bootstrap/prod modules; do
            [ -d "$dir" ] || continue
            terraform fmt -check -recursive "$dir" || FAILED=1
          done

          [ "$FAILED" -eq 0 ] || { echo "::error::Formatting issues listed above. Run 'terraform fmt -recursive' on the reported directories and commit the result."; exit 1; }
          echo "All Terraform files are correctly formatted."

      # The whole variables file for this environment's backend. Nothing about the environment - not the region, not the
      # account name - is hardcoded in this workflow.
      #
      # TESTING ONLY: read from a repository VARIABLE so its content is visible in the GitHub UI while the platform is
      # being validated. Switch to the commented line before any client deployment.
      - name: Write terraform.tfvars
        if: env.SKIP != 'true'
        env:
          # BOOTSTRAP_TFVARS: ${{ secrets.BOOTSTRAP_TFVARS }}
          BOOTSTRAP_TFVARS: ${{ vars.BOOTSTRAP_TFVARS }}
        run: |
          test -n "$BOOTSTRAP_TFVARS" || { echo "::error::BOOTSTRAP_TFVARS is empty for ${{ inputs.environment }}. Set it on that GitHub Environment - see GITHUB-SETUP.md."; exit 1; }
          printf '%s\n' "$BOOTSTRAP_TFVARS" > terraform.tfvars
          terraform fmt terraform.tfvars

      # This root is configured from two independent places: BOOTSTRAP_TFVARS describes the resources Terraform will
      # CREATE, and TF_STATE_* describes the backend every workflow READS AND WRITES. They name the same storage
      # account, so they can drift - and if they do, this pipeline creates one storage account and then stores its state
      # in a different one.
      - name: Determine what already exists
        if: env.SKIP != 'true'
        id: probe
        env:
          STATE_RG: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
        run: |
          set -euo pipefail
          STATE_KEY="bootstrap/${{ inputs.environment }}.tfstate"

          ACCOUNT_EXISTS=false
          if az storage account show --name "$STATE_SA" --resource-group "$STATE_RG" \
               --only-show-errors >/dev/null 2>&1; then
            ACCOUNT_EXISTS=true
          fi

          BLOB_EXISTS=false
          if [ "$ACCOUNT_EXISTS" = "true" ]; then
            if az storage blob exists --account-name "$STATE_SA" --container-name "$STATE_CONTAINER" \
                 --name "$STATE_KEY" --auth-mode login --only-show-errors \
                 --query exists -o tsv 2>/dev/null | grep -qi true; then
              BLOB_EXISTS=true
            fi
          fi

          # remote - the backend exists and this root's state is in it. The real
          #          state is at stake, so the plan below is the one that matters.
          # import - the account exists but nothing tracks it. The apply job
          #          imports it into state before applying.
          # create - nothing exists, so there is no state to lose.
          if   [ "$BLOB_EXISTS" = "true" ];    then MODE=remote
          elif [ "$ACCOUNT_EXISTS" = "true" ]; then MODE=import
          else                                      MODE=create
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "state_key=$STATE_KEY" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$MODE" > mode.txt
          printf '%s\n' "$STATE_KEY" > state_key.txt

          printf '  %-24s %s\n' "Storage account exists:" "$ACCOUNT_EXISTS"
          printf '  %-24s %s\n' "State blob exists:"      "$BLOB_EXISTS"
          printf '  %-24s %s\n' "Mode:"                   "$MODE"

      - name: Initialise against the existing backend
        if: env.SKIP != 'true' && steps.probe.outputs.mode == 'remote'
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ steps.probe.outputs.state_key }}" \
            -backend-config="use_azuread_auth=true"

      # The backend block has to be moved aside rather than left uninitialised.
      # "terraform init -backend=false" skips backend setup, but the azurerm block
      # is still declared and plan then refuses with "Backend initialization
      # required". Moving the file out of the root is the only way to plan with
      # purely local state.
      - name: Move the backend block aside for the local-state plan
        if: env.SKIP != 'true' && steps.probe.outputs.mode != 'remote'
        run: mv backend.tf ../backend.tf.disabled

      - name: Initialise with local state
        if: env.SKIP != 'true' && steps.probe.outputs.mode != 'remote'
        run: terraform init

      # Locking matches _terraform-plan.yml: a plan that feeds an apply takes the lease so it sees a state nothing else
      # is mutating, while a review-only plan runs with -lock=false. Review plans never write state, so taking the lease
      # would only make concurrent pull requests contend.
      - name: Create the state backend plan
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          if [ "${{ inputs.save_plan }}" = "true" ]; then
            echo "Plan will be applied: acquiring the state lock."
            terraform plan -lock-timeout=10m -out=bootstrap.tfplan
          else
            echo "Review-only plan: running with -lock=false so concurrent runs do not contend."
            terraform plan -lock=false -out=bootstrap.tfplan
          fi
          terraform show -no-color bootstrap.tfplan > plan.txt
          grep -E '^(Plan:|No changes)' plan.txt || true

      # The reason the split exists: put the numbers in front of the approver, and say plainly when something is being
      # replaced or removed.
      - name: Publish the plan summary for the approver
        if: env.SKIP != 'true'
        run: |
          MODE="${{ steps.probe.outputs.mode }}"
          {
            echo "### ${{ inputs.environment }} state backend - plan"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Environment | \`${{ inputs.environment }}\` |"
            echo "| Mode | \`$MODE\` |"
            echo "| Result | \`$(grep -m1 -E '^(Plan:|No changes)' plan.txt || echo 'see log')\` |"
            if grep -qE 'must be replaced|will be destroyed' plan.txt; then
                echo "| Replaces or destroys | YES - this changes the account holding the state for this environment. Do not approve without checking. |"
            else
              echo "| Replaces or destroys | none |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record run metadata
        if: always() && env.SKIP != 'true'
        run: |
          cat > run-metadata.json <<EOF
          {
            "operation": "bootstrap",
            "environment": "${{ inputs.environment }}",
            "phase": "plan",
            "mode": "${{ steps.probe.outputs.mode }}",
            "repository": "${{ github.repository }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "event": "${{ github.event_name }}",
            "ref": "${{ github.ref }}",
            "commit_sha": "${{ github.sha }}",
            "triggered_by": "${{ github.actor }}",
            "terraform_version": "${{ vars.TERRAFORM_VERSION }}",
            "recorded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          echo "Evidence header written to run-metadata.json"

      - name: Upload the plan for approval
        if: inputs.save_plan && env.SKIP != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-bootstrap-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            bootstrap/${{ inputs.environment }}/bootstrap.tfplan
            bootstrap/${{ inputs.environment }}/plan.txt
            bootstrap/${{ inputs.environment }}/mode.txt
            bootstrap/${{ inputs.environment }}/state_key.txt
            bootstrap/${{ inputs.environment }}/run-metadata.json
            bootstrap/${{ inputs.environment }}/.terraform.lock.hcl
          retention-days: 5
          if-no-files-found: error

      # No binary plan, so nothing downstream can apply what a pull request produced. The rendered plan and the detected
      # mode are kept for review.
      - name: Upload the review evidence bundle
        if: ${{ !inputs.save_plan && env.SKIP != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: evidence-bootstrap-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            bootstrap/${{ inputs.environment }}/plan.txt
            bootstrap/${{ inputs.environment }}/mode.txt
            bootstrap/${{ inputs.environment }}/run-metadata.json
          retention-days: 14
          if-no-files-found: warn
