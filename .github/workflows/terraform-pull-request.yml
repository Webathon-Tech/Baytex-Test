name: Terraform Pull Request Checks

# Everything a reviewer needs before approving a change, in one run. Plan only -
# this workflow can never apply anything, and holds no path to an apply job.
#
# Runs on pull requests only. A merge does not re-run it: the same commit was
# already checked on the pull request, and repeating five checks on code that has
# just been approved teaches people to ignore them.
#
# All three environments are planned, not just dev. The environment roots are
# separate copies of the same .tf files, so a change can be valid for dev and
# break prod - a name collision, or an address range that does not fit prod's
# allocation. Planning dev alone would not show it.

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - "bootstrap/**"
      - ".github/workflows/**"

permissions:
  contents: read
  id-token: write

# Superseded by a newer push to the same branch. Safe to cancel because nothing
# here writes state and the plans run with -lock=false.
concurrency:
  group: terraform-pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds, and no credentials, so it runs first and everything expensive waits
  # on it. The plan jobs depend on it because a plan against an environment with
  # no state backend reports a clean skip - without this gate a syntax error
  # could pass as three green skips.
  validate:
    name: Validate Terraform code
    uses: ./.github/workflows/_terraform-validate.yml

  # The state backend plans are gated on this rather than on the workflow's own
  # "paths" filter, because that filter decides whether the WHOLE workflow runs.
  # A change to environments/ alone should still run the environment plans, but
  # planning the state backend three more times would add minutes to every pull
  # request for no new information - the bootstrap root would be unchanged, so
  # those plans could only ever report "No changes".
  detect-bootstrap-changes:
    name: Check whether the state backend changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history: the diff below needs the base commit, which a shallow
          # clone of the merge ref does not contain.
          fetch-depth: 0

      - name: Compare the branch against the base
        id: check
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          # Fail open. If either commit is unavailable the safe answer is to run
          # the plans, not to skip them silently.
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Could not determine the diff range; running the state backend plans."
            exit 0
          fi

          FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
                    'bootstrap/**' \
                    '.github/workflows/_bootstrap-*.yml' \
                    '.github/workflows/terraform-bootstrap.yml')

          if [ -n "$FILES" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Bootstrap files changed:"
            printf '%s\n' "$FILES" | sed 's/^/  /'
            {
              echo "### State backend plans will run"
              echo ""
              printf '%s\n' "$FILES" | sed 's/^/- `/; s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No bootstrap files changed; skipping the state backend plans."
            {
              echo "### State backend plans skipped"
              echo ""
              echo "Nothing under \`bootstrap/\` or the bootstrap workflows changed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Reports, never fails. The three environment roots can drift with nothing to
  # notice. Divergence is sometimes deliberate, and a hard failure would train
  # people to work around the check; making it visible on every pull request is
  # what matters.
  parity:
    name: Check environment root parity
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Compare the dev, test and prod roots
        run: |
          set -uo pipefail
          DIFFS=0
          : > /tmp/rows.md

          {
            echo "### Environment root parity"
            echo ""
            echo "\`environments/{dev,test,prod}\` should hold identical \`.tf\` files."
            echo "Only \`terraform.tfvars\` is expected to differ, and it is not in git."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          for f in main.tf variables.tf outputs.tf locals.tf providers.tf versions.tf backend.tf; do
            base="environments/dev/$f"
            [ -f "$base" ] || continue
            for env in test prod; do
              other="environments/$env/$f"
              if [ ! -f "$other" ]; then
                echo "| \`$f\` | dev vs $env | **missing in $env** |" >> /tmp/rows.md
                DIFFS=$((DIFFS+1))
                continue
              fi
              if ! diff -q "$base" "$other" >/dev/null 2>&1; then
                echo "| \`$f\` | dev vs $env | **differs** |" >> /tmp/rows.md
                DIFFS=$((DIFFS+1))
              fi
            done
          done

          if [ "$DIFFS" -eq 0 ]; then
            echo "All roots are identical." >> "$GITHUB_STEP_SUMMARY"
            echo "Roots are identical."
          else
            {
              echo "| File | Comparison | Result |"
              echo "| --- | --- | --- |"
              cat /tmp/rows.md
              echo ""
              echo "> $DIFFS difference(s). This is a **report, not a failure** - divergence may"
              echo "> be intentional. If it is not, copy the change to the other roots."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$DIFFS difference(s) found:"
            cat /tmp/rows.md
            for env in test prod; do
              for f in main.tf variables.tf outputs.tf locals.tf providers.tf versions.tf; do
                [ -f "environments/dev/$f" ] && [ -f "environments/$env/$f" ] || continue
                diff -u "environments/dev/$f" "environments/$env/$f" || true
              done
            done
          fi
          exit 0

  # save_plan: false is what makes these review-only. No binary plan is uploaded,
  # so nothing downstream can apply what is produced here.
  plan-dev:
    name: Plan dev (review only)
    needs: validate
    uses: ./.github/workflows/_terraform-plan.yml
    with:
      environment: dev
      operation: deploy
      save_plan: false
    secrets: inherit

  plan-test:
    name: Plan test (review only)
    needs: validate
    uses: ./.github/workflows/_terraform-plan.yml
    with:
      environment: test
      operation: deploy
      save_plan: false
    secrets: inherit

  plan-prod:
    name: Plan prod (review only)
    needs: validate
    uses: ./.github/workflows/_terraform-plan.yml
    with:
      environment: prod
      operation: deploy
      save_plan: false
    secrets: inherit

  # ------------------------------------------------------- state backend plans
  # Run ONLY when the pull request changes bootstrap files. Planned for all three
  # environments for the same reason the platform is: one root serves all three,
  # so a change can be harmless for dev and destructive for prod.
  #
  # This is the review that matters most on this root. The storage account it
  # manages holds the state for every environment, so a change forcing its
  # replacement would destroy the state it is tracked in - and previously that
  # was only visible after somebody triggered the bootstrap workflow by hand.
  #
  # save_plan: false keeps them review-only: no binary plan is uploaded, so
  # nothing a pull request produces can be applied.
  plan-bootstrap-dev:
    name: Plan dev state backend (review only)
    needs: [validate, detect-bootstrap-changes]
    if: needs.detect-bootstrap-changes.outputs.changed == 'true'
    uses: ./.github/workflows/_bootstrap-plan.yml
    with:
      environment: dev
      save_plan: false
    secrets: inherit

  plan-bootstrap-test:
    name: Plan test state backend (review only)
    needs: [validate, detect-bootstrap-changes]
    if: needs.detect-bootstrap-changes.outputs.changed == 'true'
    uses: ./.github/workflows/_bootstrap-plan.yml
    with:
      environment: test
      save_plan: false
    secrets: inherit

  plan-bootstrap-prod:
    name: Plan prod state backend (review only)
    needs: [validate, detect-bootstrap-changes]
    if: needs.detect-bootstrap-changes.outputs.changed == 'true'
    uses: ./.github/workflows/_bootstrap-plan.yml
    with:
      environment: prod
      save_plan: false
    secrets: inherit
