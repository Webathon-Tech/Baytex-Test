name: Terraform Pull Request Checks

# Everything a reviewer needs before approving a change, in one run. Plan only - this workflow can never apply anything
# and holds no path to an apply job.
#
# It runs on every pull request, with no paths filter. Filtering at the workflow level decides whether the workflow
# STARTS, so a documentation-only change would never run it - and a required status check that never runs sits pending
# forever and blocks the merge. The filtering happens per job instead, driven by "Detect changed areas".
#
# Each area triggers only the checks that can say something about it:
#
#   environments/**   environment parity, plus all three platform plans
#   modules/**        all three platform plans, because the roots consume the modules
#   bootstrap/**      bootstrap parity, plus all three state backend plans
#   anything else     neither
#
# "Validate Terraform code" is the only check that should be required in branch protection. Everything else here is
# conditional, and a required check that gets skipped is the same trap as a paths filter.

on:
  pull_request:

permissions:
  contents: read
  id-token: write

# Superseded by a newer push to the same branch. Safe to cancel because nothing here writes state and the plans run with
# -lock=false.
concurrency:
  group: terraform-pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds, and no credentials. Every plan job depends on it, because a plan against an environment with no state
  # backend reports a clean skip - without this gate a syntax error could pass as a set of green skips.
  validate:
    name: Validate Terraform code
    uses: ./.github/workflows/_terraform-validate.yml

  # One git diff against the pull request base decides which of the checks below have anything to say.
  #
  # The bootstrap flag counts bootstrap/** only. What a state backend plan shows is decided by that root's .tf files and
  # the BOOTSTRAP_TFVARS variable, so editing the bootstrap workflows cannot change the plan output - gating on them
  # would run three Azure-authenticated jobs to reprint a plan nobody changed.
  detect:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.check.outputs.environments }}
      bootstrap: ${{ steps.check.outputs.bootstrap }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history: the diff below needs the base commit, which a shallow clone of the merge ref does not contain.
          fetch-depth: 0

      - name: Compare the branch against the base
        id: check
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          # Fail open. If either commit is unavailable the safe answer is to run everything, not to skip silently.
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "environments=true" >> "$GITHUB_OUTPUT"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "Could not determine the diff range; running every check."
            exit 0
          fi

          changed () {
            if [ -n "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$@")" ]; then echo true; else echo false; fi
          }

          # modules/** feeds the environment roots, so a module change is planned as an environment change.
          ENVIRONMENTS=$(changed 'environments/**' 'modules/**')
          BOOTSTRAP=$(changed 'bootstrap/**')

          echo "environments=$ENVIRONMENTS" >> "$GITHUB_OUTPUT"
          echo "bootstrap=$BOOTSTRAP" >> "$GITHUB_OUTPUT"
          echo "environments or modules changed: $ENVIRONMENTS"
          echo "bootstrap changed:               $BOOTSTRAP"

  # Reports, never fails. The three roots hold identical .tf files and can drift with nothing to notice; divergence is
  # sometimes deliberate, and a hard failure would train people to work around the check.
  parity-environments:
    name: Check environment root parity
    needs: detect
    if: needs.detect.outputs.environments == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Compare the dev, test and prod platform roots
        run: |
          set -uo pipefail
          DIFFS=0

          for f in main.tf variables.tf outputs.tf locals.tf providers.tf versions.tf backend.tf; do
            [ -f "environments/dev/$f" ] || continue
            for env in test prod; do
              if [ ! -f "environments/$env/$f" ]; then
                echo "missing in $env: $f"
                DIFFS=$((DIFFS+1))
              elif ! diff -q "environments/dev/$f" "environments/$env/$f" >/dev/null 2>&1; then
                echo "differs: $f (dev vs $env)"
                diff -u "environments/dev/$f" "environments/$env/$f" || true
                DIFFS=$((DIFFS+1))
              fi
            done
          done

          if [ "$DIFFS" -eq 0 ]; then
            echo "All three platform roots are identical."
          else
            echo "::notice::$DIFFS difference(s) between the platform roots. This is a report, not a failure."
          fi

  # The bootstrap roots are three copies of the same files for the same reason the platform roots are, so they can drift
  # the same way.
  parity-bootstrap:
    name: Check bootstrap root parity
    needs: detect
    if: needs.detect.outputs.bootstrap == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Compare the dev, test and prod bootstrap roots
        run: |
          set -uo pipefail
          DIFFS=0

          for f in main.tf variables.tf outputs.tf versions.tf backend.tf; do
            [ -f "bootstrap/dev/$f" ] || continue
            for env in test prod; do
              if [ ! -f "bootstrap/$env/$f" ]; then
                echo "missing in $env: $f"
                DIFFS=$((DIFFS+1))
              elif ! diff -q "bootstrap/dev/$f" "bootstrap/$env/$f" >/dev/null 2>&1; then
                echo "differs: $f (dev vs $env)"
                diff -u "bootstrap/dev/$f" "bootstrap/$env/$f" || true
                DIFFS=$((DIFFS+1))
              fi
            done
          done

          if [ "$DIFFS" -eq 0 ]; then
            echo "All three bootstrap roots are identical."
          else
            echo "::notice::$DIFFS difference(s) between the bootstrap roots. This is a report, not a failure."
          fi

  # ------------------------------------------------------------------- platform plans
  # All three environments are
  # planned, not just dev. The roots are separate copies of the same .tf files, so a change can be valid for dev and
  # break prod - a name collision, or an address range that does not fit prod's allocation.
  #
  # save_plan: false is what makes these review-only. No binary plan is uploaded, so nothing can apply what they show.
  plan-dev:
    name: Plan dev platform (review only)
    needs: [validate, detect]
    if: needs.detect.outputs.environments == 'true'
    uses: ./.github/workflows/_terraform-plan.yml
    with:
      environment: dev
      operation: deploy
      save_plan: false
    secrets: inherit

  plan-test:
    name: Plan test platform (review only)
    needs: [validate, detect]
    if: needs.detect.outputs.environments == 'true'
    uses: ./.github/workflows/_terraform-plan.yml
    with:
      environment: test
      operation: deploy
      save_plan: false
    secrets: inherit

  plan-prod:
    name: Plan prod platform (review only)
    needs: [validate, detect]
    if: needs.detect.outputs.environments == 'true'
    uses: ./.github/workflows/_terraform-plan.yml
    with:
      environment: prod
      operation: deploy
      save_plan: false
    secrets: inherit

  # -------------------------------------------------------------- state backend plans
  # The storage account these manage
  # holds the state for its environment, so a change forcing its replacement would destroy the state it is tracked in.
  # Before this check existed that was only visible after somebody triggered the bootstrap workflow by hand.
  plan-bootstrap-dev:
    name: Plan dev bootstrap storage account (review only)
    needs: [validate, detect]
    if: needs.detect.outputs.bootstrap == 'true'
    uses: ./.github/workflows/_bootstrap-plan.yml
    with:
      environment: dev
      save_plan: false
    secrets: inherit

  plan-bootstrap-test:
    name: Plan test bootstrap storage account (review only)
    needs: [validate, detect]
    if: needs.detect.outputs.bootstrap == 'true'
    uses: ./.github/workflows/_bootstrap-plan.yml
    with:
      environment: test
      save_plan: false
    secrets: inherit

  plan-bootstrap-prod:
    name: Plan prod bootstrap storage account (review only)
    needs: [validate, detect]
    if: needs.detect.outputs.bootstrap == 'true'
    uses: ./.github/workflows/_bootstrap-plan.yml
    with:
      environment: prod
      save_plan: false
    secrets: inherit
