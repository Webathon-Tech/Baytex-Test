name: Reusable - Bootstrap Apply

# Applies the state backend plan approved by _bootstrap-plan.yml, then moves this root's own state into the backend it
# has just created.
#
# Runs in the "<env>-apply" GitHub Environment, so required reviewers attached there gate the creation of the state
# backend exactly as they gate a deployment.
#
# The sequence is decided by the mode recorded in the approved artefact, never re-detected here - the reviewer approved
# a specific plan built for a specific mode, and re-probing could silently take a different path.
#
# The identity and state backend come from plan-config.json in the same artefact, recorded by the plan job from
# <env>-plan, and terraform.tfvars comes from the checkout of the same commit the plan was made from.

on:
  workflow_call:
    inputs:
      environment:
        description: Environment whose state backend is being created (dev / test / prod).
        required: true
        type: string
      allowed_refs:
        description: Space-separated ref patterns permitted to bootstrap.
        required: false
        default: refs/heads/main refs/heads/hotfix/*
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-apply
    defaults:
      run:
        shell: bash
        working-directory: bootstrap/${{ inputs.environment }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ARM_USE_AZUREAD: "true"

    steps:
      # working-directory: . is required. The job default is the bootstrap root, which does not exist until Checkout
      # runs, so without it this step would die on a missing directory before evaluating the ref at all.
      - name: Check the branch is allowed to bootstrap
        working-directory: .
        env:
          ALLOWED_REFS: ${{ inputs.allowed_refs }}
        run: |
          set -uo pipefail
          MATCHED=false
          for pattern in $ALLOWED_REFS; do
            # $pattern is deliberately unquoted: inside "case" an unquoted value is treated as a glob, which is what
            # makes refs/heads/hotfix/* work.
            case "${{ github.ref }}" in
              $pattern) MATCHED=true; break ;;
            esac
          done

          if [ "$MATCHED" != "true" ]; then
            echo "::error::Refusing to bootstrap ${{ inputs.environment }} from '${{ github.ref }}'. Allowed: $ALLOWED_REFS"
            exit 1
          fi
          echo "Ref '${{ github.ref }}' is allowed to bootstrap."

      - name: Check out the repository
        uses: actions/checkout@v7

      # Downloaded first, because every later step depends on it: it carries the plan, the mode, and the
      # plan-config.json the plan was made with.
      - name: Download the approved state backend plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan-bootstrap-${{ inputs.environment }}-${{ github.run_id }}
          path: bootstrap/${{ inputs.environment }}

      # The mode was decided by the plan job and travels in the artefact, so the apply performs exactly the sequence
      # that was reviewed rather than re-probing and possibly taking a different path. The identity and state backend
      # travel the same way: the plan job checked them on <env>-plan and recorded them, so the apply signs in as the
      # identity, and creates or opens the backend, that the approved plan was made for.
      - name: Read the mode and configuration the plan was built for
        id: approved
        run: |
          set -euo pipefail
          test -f plan-config.json || { echo "::error::The approved plan artefact has no plan-config.json. Start a new run."; exit 1; }

          MODE=$(tr -d '[:space:]' < mode.txt)
          KEY=$(tr -d '[:space:]' < state_key.txt)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "state_key=$KEY" >> "$GITHUB_OUTPUT"

          # TF_STATE_KEY is the platform's state key, which this root only reports, so it is not required here.
          MISSING=""
          for NAME in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID TF_STATE_RESOURCE_GROUP \
                      TF_STATE_STORAGE_ACCOUNT TF_STATE_CONTAINER TF_STATE_KEY; do
            VALUE=$(jq -r --arg name "$NAME" '.[$name] // ""' plan-config.json)
            [ -n "$VALUE" ] || [ "$NAME" = "TF_STATE_KEY" ] || MISSING="$MISSING $NAME"
            echo "$NAME=$VALUE" >> "$GITHUB_OUTPUT"
          done

          if [ -n "$MISSING" ]; then
            echo "::error::The approved ${{ inputs.environment }} plan records no value for:$MISSING. Start a new run."
            exit 1
          fi
          echo "Applying mode '$MODE' with state key '$KEY'."

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ steps.approved.outputs.AZURE_CLIENT_ID }}
          tenant-id: ${{ steps.approved.outputs.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.approved.outputs.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialise against the existing backend
        if: steps.approved.outputs.mode == 'remote'
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ steps.approved.outputs.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ steps.approved.outputs.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ steps.approved.outputs.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ steps.approved.outputs.state_key }}" \
            -backend-config="use_azuread_auth=true"

      # ------------------------------------------------------- create / import
      - name: Move the backend block aside for the local-state phase
        if: steps.approved.outputs.mode != 'remote'
        run: mv backend.tf ../backend.tf.disabled

      - name: Initialise with local state
        if: steps.approved.outputs.mode != 'remote'
        run: terraform init

      # Importing is a state operation, not something a saved plan can carry, so it has to happen here. The approver saw
      # a pre-import plan and the summary said so explicitly.
      - name: Import the pre-existing backend resources
        if: steps.approved.outputs.mode == 'import'
        env:
          SUBSCRIPTION_ID: ${{ steps.approved.outputs.AZURE_SUBSCRIPTION_ID }}
          STATE_RG: ${{ steps.approved.outputs.TF_STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ steps.approved.outputs.TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ steps.approved.outputs.TF_STATE_CONTAINER }}
        run: |
          set -euo pipefail
          RG_ID="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$STATE_RG"
          SA_ID="$RG_ID/providers/Microsoft.Storage/storageAccounts/$STATE_SA"
          CONTAINER_ID="$SA_ID/blobServices/default/containers/$STATE_CONTAINER"

          terraform import azurerm_resource_group.state   "$RG_ID" || echo "resource group already tracked"
          terraform import azurerm_storage_account.state  "$SA_ID" || echo "storage account already tracked"
          terraform import azapi_resource.state_container "$CONTAINER_ID?api-version=2026-04-01" || echo "container already tracked"

          # The approved plan was built before the import and no longer matches state, so it is replaced here. The end
          # state is unchanged - the idempotency check below asserts the result converges.
          terraform plan -lock-timeout=10m -out=bootstrap.tfplan

      - name: Apply the approved state backend plan
        run: |
          set -o pipefail
          terraform apply -lock-timeout=10m -auto-approve bootstrap.tfplan 2>&1 | tee apply.log

      # --------------------------------------------------------------- migrate
      - name: Restore the backend block
        if: steps.approved.outputs.mode != 'remote'
        run: mv ../backend.tf.disabled backend.tf

      - name: Migrate the local state into the new backend
        if: steps.approved.outputs.mode != 'remote'
        run: |
          terraform init -migrate-state -force-copy \
            -backend-config="resource_group_name=${{ steps.approved.outputs.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ steps.approved.outputs.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ steps.approved.outputs.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ steps.approved.outputs.state_key }}" \
            -backend-config="use_azuread_auth=true"

      # ------------------------------------------------------------- reconcile
      - name: Record the resources now in state
        if: always()
        run: terraform state list > state-list.txt 2>/dev/null || true

      - name: Record the backend configuration
        if: always()
        env:
          STATE_RG: ${{ steps.approved.outputs.TF_STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ steps.approved.outputs.TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ steps.approved.outputs.TF_STATE_CONTAINER }}
          STATE_KEY: ${{ steps.approved.outputs.TF_STATE_KEY }}
        run: |
          cat > backend-config.hcl <<EOF
          resource_group_name  = "$STATE_RG"
          storage_account_name = "$STATE_SA"
          container_name       = "$STATE_CONTAINER"
          key                  = "$STATE_KEY"
          use_azuread_auth     = true
          EOF
          printf '%s\n' "${{ steps.approved.outputs.mode }}" > applied-mode.txt
          cat backend-config.hcl

      - name: Publish the backend configuration for the platform workflows
        if: success()
        env:
          STATE_RG: ${{ steps.approved.outputs.TF_STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ steps.approved.outputs.TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ steps.approved.outputs.TF_STATE_CONTAINER }}
          STATE_KEY: ${{ steps.approved.outputs.TF_STATE_KEY }}
        run: |
          {
            echo "### ${{ inputs.environment }} state backend - ready"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`${{ inputs.environment }}\` |"
            echo "| Mode applied | \`${{ steps.approved.outputs.mode }}\` |"
            echo "| Storage account | \`$STATE_SA\` |"
            echo "| Container | \`$STATE_CONTAINER\` |"
            echo "| State key | \`${{ steps.approved.outputs.state_key }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record run metadata
        if: always()
        run: |
          cat > run-metadata.json <<EOF
          {
            "operation": "bootstrap",
            "environment": "${{ inputs.environment }}",
            "phase": "apply",
            "mode": "${{ steps.approved.outputs.mode }}",
            "repository": "${{ github.repository }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "event": "${{ github.event_name }}",
            "ref": "${{ github.ref }}",
            "commit_sha": "${{ github.sha }}",
            "triggered_by": "${{ github.actor }}",
            "terraform_version": "${{ vars.TERRAFORM_VERSION }}",
            "recorded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          echo "Evidence header written to run-metadata.json"

      # This root's storage account holds the environment's Terraform state, so the question "what exactly did that run
      # do" must not depend on log retention.
      - name: Upload the apply evidence bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-bootstrap-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            bootstrap/${{ inputs.environment }}/plan.txt
            bootstrap/${{ inputs.environment }}/apply.log
            bootstrap/${{ inputs.environment }}/state-list.txt
            bootstrap/${{ inputs.environment }}/backend-config.hcl
            bootstrap/${{ inputs.environment }}/applied-mode.txt
            bootstrap/${{ inputs.environment }}/run-metadata.json
          retention-days: 30
          if-no-files-found: warn
