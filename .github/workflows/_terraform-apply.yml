name: Reusable - Terraform Apply

# Applies the exact binary plan that _terraform-plan.yml produced earlier in the same run. It never re-plans, because a
# plan taken after approval could differ from the one that was approved.
#
# One workflow covers both directions. A destroy plan is a plan like any other, so "terraform apply tfplan" performs the
# teardown. Only the steps that follow the apply differ: a deploy exports its outputs and approves the Databricks
# private endpoint connections, and a destroy records how many resources were removed.
#
# This job runs in the "<env>-apply" GitHub Environment. That is the single place an approval gate belongs: attach
# required reviewers to <env>-apply and every workflow that changes that environment - deploy, destroy, bootstrap and
# unlock - pauses for approval before it changes anything.

on:
  workflow_call:
    inputs:
      environment:
        description: Environment to apply to (dev / test / prod).
        required: true
        type: string
      operation:
        description: 'Which plan to consume: "deploy" or "destroy".'
        required: false
        default: deploy
        type: string
      allowed_refs:
        description: >-
          Space-separated ref patterns permitted to apply. Deploys allow the
          hotfix branches; destroys are restricted to main by the caller.
        required: false
        default: refs/heads/main refs/heads/hotfix/*
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-apply
    defaults:
      run:
        shell: bash
        working-directory: environments/${{ inputs.environment }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ARM_USE_AZUREAD: "true"
      DATABRICKS_TF_ENABLED_PF_RESOURCES: databricks_mws_ncc_private_endpoint_rule

    steps:
      # workflow_dispatch lets whoever starts a run pick any branch. Without this check, anyone with write access could
      # apply unreviewed code to production by choosing their own branch from the dropdown.
      #
      # The calling workflow enforces the same rule in its preflight job; this copy protects the reusable workflow from
      # any future caller that forgets.
      #
      # working-directory: . is required. The job default is environments/<env>, which does not exist until Checkout
      # runs, so without it this step would die on a missing directory before evaluating the ref at all.
      - name: Check the branch is allowed to apply
        working-directory: .
        env:
          ALLOWED_REFS: ${{ inputs.allowed_refs }}
        run: |
          set -uo pipefail
          MATCHED=false
          for pattern in $ALLOWED_REFS; do
            # $pattern is deliberately unquoted: inside "case" an unquoted value is treated as a glob, which is what
            # makes refs/heads/hotfix/* work.
            case "${{ github.ref }}" in
              $pattern) MATCHED=true; break ;;
            esac
          done

          if [ "$MATCHED" != "true" ]; then
            echo "::error::Refusing to ${{ inputs.operation }} ${{ inputs.environment }} from '${{ github.ref }}'. Allowed: $ALLOWED_REFS"
            exit 1
          fi
          echo "Ref '${{ github.ref }}' is allowed to ${{ inputs.operation }}."

      - name: Check out the repository
        uses: actions/checkout@v7

      # An environment whose service principal does not exist yet has no AZURE_CLIENT_ID, and azure/login then fails
      # with an authentication error that says nothing about the real cause. An apply names its environment explicitly,
      # so this is a genuine error rather than something to skip - it just needs to say what is actually wrong.
      - name: Check the environment is configured
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          STATE_RG: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
        run: |
          set -uo pipefail
          MISSING=""
          need () { [ -n "${2:-}" ] || MISSING="$MISSING $1"; }
          need AZURE_CLIENT_ID          "${AZURE_CLIENT_ID:-}"
          need AZURE_TENANT_ID          "${AZURE_TENANT_ID:-}"
          need AZURE_SUBSCRIPTION_ID    "${AZURE_SUBSCRIPTION_ID:-}"
          need TF_STATE_RESOURCE_GROUP  "${STATE_RG:-}"
          need TF_STATE_STORAGE_ACCOUNT "${STATE_SA:-}"
          need TF_STATE_CONTAINER       "${STATE_CONTAINER:-}"

          if [ -n "$MISSING" ]; then
            echo "::error::Environment '${{ inputs.environment }}' is not configured. Missing:$MISSING. Create its service principal and set these variables on the ${{ inputs.environment }}-plan and ${{ inputs.environment }}-apply GitHub Environments."
            exit 1
          fi
          echo "Environment ${{ inputs.environment }} is configured."

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # TFVARS is read from an environment variable, which GitHub does not mask in logs. To hold it as an
      # environment secret instead, swap which of the two lines below is commented, as described in
      # docs/github-setup.md under "Variables or secrets".
      - name: Write terraform.tfvars
        env:
          # TFVARS: ${{ secrets.TFVARS }}
          TFVARS: ${{ vars.TFVARS }}
        run: |
          test -n "$TFVARS" || { echo "::error::TFVARS is empty for ${{ inputs.environment }}-apply. Set it on that GitHub Environment."; exit 1; }
          printf '%s\n' "$TFVARS" > terraform.tfvars

      # Downloaded before init on purpose: the artefact carries the .terraform.lock.hcl the reviewer saw, so init
      # selects those exact provider versions rather than resolving fresh ones.
      - name: Download the approved ${{ inputs.operation }} plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ inputs.operation }}-${{ inputs.environment }}-${{ github.run_id }}
          path: environments/${{ inputs.environment }}

      - name: Initialise the Terraform backend using the reviewed lock file
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="use_azuread_auth=true"

      # Deleting an NCC private endpoint rule whose connection is established only deactivates it, and Databricks removes
      # the private endpoint seven days later. Azure refuses to delete a Private Link Service that still has a
      # connection, so before the apply, every Private Link Service that the approved plan deletes or replaces has its
      # connections removed. Connections are not held in Terraform state, so the saved plan remains valid, and a plan
      # that removes no Private Link Service changes nothing here.
      - name: Clear connections from Private Link Services the plan removes
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          PLS_IDS=$(terraform show -json tfplan | jq -r '
            .resource_changes[]
            | select(.type == "azurerm_private_link_service" and (.change.actions | index("delete")))
            | .change.before.id')

          if [ -z "$PLS_IDS" ]; then
            echo "The plan removes no Private Link Service."
            exit 0
          fi

          for PLS in $PLS_IDS; do
            echo "Private Link Service removed by the plan: $(basename "$PLS")"
            for CONN in $(az network private-endpoint-connection list --id "$PLS" --query "[].id" -o tsv); do
              echo "  removing connection $(basename "$CONN")"
              az network private-endpoint-connection delete --id "$CONN" --yes --only-show-errors -o none
            done
          done

          # Azure needs a moment before the service reports zero connections.
          sleep 20

      # Applies the plan this run produced and had approved. Terraform refuses a saved plan whose state has changed
      # since it was made, so nothing other than the reviewed actions can reach Azure.
      - name: Apply the approved deployment plan
        if: inputs.operation == 'deploy'
        run: |
          set -o pipefail
          terraform apply -lock-timeout=10m -auto-approve tfplan 2>&1 | tee apply.log

      # A destroy needs more than one pass. Removing the NCC binding and removing the NCC itself are separate Databricks
      # API calls, and the unbind is not immediately visible - the delete then fails with "unable to be deleted because
      # it is attached to one or more workspaces". By the next attempt the unbind has landed.
      #
      # Each retry re-plans, because a partially completed destroy makes the saved plan stale. That is safe here in a
      # way it would not be for a deploy: the approved end state of a destroy is unambiguous - nothing left - so a
      # re-plan cannot drift away from what the approver agreed to.
      - name: Apply the approved destroy plan
        if: inputs.operation == 'destroy'
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            # Written into apply.log as well as the job log, so the evidence bundle shows on its own that a retry
            # happened. Without this the artefact ends on the LAST attempt's summary - "1 destroyed" after an earlier
            # error - which reads like a failure rather than a recovery.
            echo "=== destroy attempt $attempt of 3 ===" | tee -a apply.log
            if terraform apply -lock-timeout=10m -auto-approve tfplan 2>&1 | tee -a apply.log; then
              echo "Destroy completed on attempt $attempt." | tee -a apply.log
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Destroy did not complete after $attempt attempts."
              echo "Destroy FAILED after $attempt attempts." | tee -a apply.log
              exit 1
            fi
            echo "Attempt $attempt did not finish; waiting for Databricks and Azure state to settle." | tee -a apply.log
            sleep 45

            # Azure refuses to delete a Private Link Service that still has endpoint connections, and the private
            # endpoints Databricks created for the NCC rules outlive the NCC itself. Retrying alone never clears them,
            # so they are removed here before the next attempt re-plans.
            for PLS_ID in $(terraform output -json private_link_service_ids 2>/dev/null | jq -r '.[]?'); do
              PLS_RG=$(echo "$PLS_ID" | cut -d/ -f5)
              PLS_NAME=$(echo "$PLS_ID" | cut -d/ -f9)
              for CONNECTION in $(az network private-link-service show -g "$PLS_RG" -n "$PLS_NAME" --query "privateEndpointConnections[].name" -o tsv 2>/dev/null); do
                echo "Removing endpoint connection $CONNECTION from $PLS_NAME." | tee -a apply.log
                az network private-link-service connection delete -g "$PLS_RG" --service-name "$PLS_NAME" -n "$CONNECTION" -o none 2>/dev/null || true
              done
            done

            terraform plan -destroy -lock-timeout=10m -out=tfplan
          done

      - name: Export Terraform outputs
        if: inputs.operation == 'deploy'
        run: terraform output -json > outputs.json

      # Every NCC private endpoint rule makes Databricks create a private endpoint to the data storage account or to a
      # Private Link Service, and serverless compute cannot use it until the connection is approved. Databricks creates
      # the endpoints a few minutes after the apply, so the script keeps reviewing the targets for up to 20 minutes.
      #
      # The endpoint names come from the outputs this apply produced, so only connections for the environment's current
      # rules are approved. Connections that are already approved are left alone, and any other connection is reported
      # without being changed, so re-running a deploy is safe.
      #
      # -Confirm:$false is required: the script asks for confirmation before each approval, which an unattended run
      # cannot answer.
      - name: Approve the NCC private endpoint connections
        if: inputs.operation == 'deploy'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/Approve-BaytexDatabricksPrivateEndpoints.ps1" `
            -TerraformOutputPath outputs.json `
            -WaitMinutes 20 `
            -IncludeAlreadyApproved `
            -Confirm:$false *>&1 | Tee-Object -FilePath approve-private-endpoints.log
          $code = $LASTEXITCODE

          switch ($code) {
            0 { exit 0 }
            3 { Write-Output "::error::Expected NCC private endpoints did not appear within 20 minutes, or a rule has no endpoint name. See approve-private-endpoints.log in the evidence bundle." }
            4 { Write-Output "::error::An NCC private endpoint connection is rejected or disconnected and cannot be approved. Recreate the matching NCC rule." }
            default { Write-Output "::error::Approving the NCC private endpoint connections failed with exit code $code." }
          }
          exit $code

      - name: Record the resources now in state
        if: always()
        run: terraform state list > state-after.txt 2>/dev/null || true

      - name: Publish the deployment summary
        if: inputs.operation == 'deploy' && success()
        run: |
          out () { terraform output -raw "$1" 2>/dev/null || echo "-"; }
          URL=$(out databricks_workspace_url)
          WORKSPACE_ID=$(out databricks_workspace_id)
          STORAGE=$(out data_storage_account_name)
          NAT_IP=$(out nat_public_ip)
          APPROVED=$(sed -n 's/^Approved by this run:[[:space:]]*\([0-9][0-9]*\).*/\1/p' approve-private-endpoints.log 2>/dev/null)
          ALREADY=$(sed -n 's/^Already approved:[[:space:]]*\([0-9][0-9]*\).*/\1/p' approve-private-endpoints.log 2>/dev/null)

          {
            echo "### ${{ inputs.environment }} platform - deployed"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Workspace URL | $URL |"
            echo "| Workspace ID | \`$WORKSPACE_ID\` |"
            echo "| Data storage account | \`$STORAGE\` |"
            echo "| NAT Gateway public IP | \`$NAT_IP\` |"
            echo "| NCC private endpoint connections | All approved: ${APPROVED:-0} by this run, ${ALREADY:-0} already approved |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Counted from the state lists taken either side of the destroy rather than from the apply log: after a retry the
      # log's final line covers only the last attempt. Data sources are left out so the count matches Terraform's own.
      # grep -c prints 0 and exits 1 when nothing matches, so "|| true" (not "|| echo 0") keeps each count to a
      # single number.
      - name: Publish the teardown summary
        if: inputs.operation == 'destroy' && success()
        run: |
          BEFORE=$(grep -cvE '^$|(^|\.)data\.' state-before.txt 2>/dev/null || true)
          AFTER=$(grep -cvE '^$|(^|\.)data\.' state-after.txt 2>/dev/null || true)
          BEFORE=${BEFORE:-0}
          AFTER=${AFTER:-0}

          {
            echo "### ${{ inputs.environment }} platform - destroyed"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`${{ inputs.environment }}\` |"
            if [ "$BEFORE" -eq 0 ]; then
              echo "| Resources destroyed | Nothing to destroy - the state was already empty |"
            else
              echo "| Resources destroyed | $((BEFORE - AFTER)) of $BEFORE |"
            fi
            echo "| Resources remaining | $AFTER |"
            echo "| State backend | Kept, so Deploy can rebuild this environment without bootstrapping again |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record run metadata
        if: always()
        run: |
          cat > run-metadata.json <<EOF
          {
            "operation": "${{ inputs.operation }}",
            "environment": "${{ inputs.environment }}",
            "phase": "apply",
            "repository": "${{ github.repository }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "event": "${{ github.event_name }}",
            "ref": "${{ github.ref }}",
            "commit_sha": "${{ github.sha }}",
            "triggered_by": "${{ github.actor }}",
            "terraform_version": "${{ vars.TERRAFORM_VERSION }}",
            "recorded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          echo "Evidence header written to run-metadata.json"

      # The durable record: 30 days, and uploaded even when the apply failed, because a failed apply is exactly the run
      # somebody needs to reconstruct.
      - name: Upload the apply evidence bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ inputs.operation }}-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            environments/${{ inputs.environment }}/plan.txt
            environments/${{ inputs.environment }}/apply.log
            environments/${{ inputs.environment }}/outputs.json
            environments/${{ inputs.environment }}/approve-private-endpoints.log
            environments/${{ inputs.environment }}/state-before.txt
            environments/${{ inputs.environment }}/state-after.txt
            environments/${{ inputs.environment }}/run-metadata.json
          retention-days: 30
          if-no-files-found: warn
