name: Reusable - Terraform Validate

# Formatting and syntax checks for every Terraform root in the repository.
#
# Deliberately needs no Azure credentials and no state access. "terraform init
# -backend=false" is enough for validate, so this is safe to run on a branch
# opened by someone with no deployment rights, and it finishes in seconds.
#
# The plan jobs depend on this rather than running beside it. A plan against an environment with no state backend
# reports a clean skip, so without this gate a syntax error could pass unnoticed as three green skips.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Scoped to the code this pipeline deploys. "terraform fmt" takes a single
      # target, so the deployed paths are walked in turn rather than recursing
      # from the repository root - which would also grade roots that are never
      # planned or applied from here.
      - name: Check Terraform formatting
        run: |
          set -uo pipefail
          FAILED=0

          for dir in environments/dev environments/test environments/prod \
                     bootstrap/dev bootstrap/test bootstrap/prod modules; do
            [ -d "$dir" ] || continue
            terraform fmt -check -recursive "$dir" || FAILED=1
          done

          if [ "$FAILED" -eq 0 ]; then
            echo "All Terraform files are correctly formatted."
          else
            echo "::error::Formatting issues listed above. Run 'terraform fmt -recursive' on the reported directories and commit the result."
            exit 1
          fi

      # Each root is validated on its own. Modules are validated through the roots that call them, which is also how
      # they are consumed in practice.
      - name: Validate every Terraform root
        run: |
          set -uo pipefail
          FAILED=0
          : > validate.txt

          for dir in environments/dev environments/test environments/prod \
                     bootstrap/dev bootstrap/test bootstrap/prod; do
            [ -d "$dir" ] || continue
            echo "::group::validate $dir"
            if terraform -chdir="$dir" init -backend=false -input=false >/dev/null 2>&1 \
               && terraform -chdir="$dir" validate -no-color >> validate.txt 2>&1; then
              echo "PASS $dir" | tee -a validate.txt
            else
              echo "::error::terraform validate failed in $dir"
              terraform -chdir="$dir" validate -no-color 2>&1 | tee -a validate.txt || true
              echo "FAIL $dir" >> validate.txt
              FAILED=1
            fi
            echo "::endgroup::"
          done

          exit $FAILED

      - name: Record run metadata
        if: always()
        run: |
          cat > run-metadata.json <<EOF
          {
            "operation": "validate",
            "environment": "all",
            "repository": "${{ github.repository }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "event": "${{ github.event_name }}",
            "ref": "${{ github.ref }}",
            "commit_sha": "${{ github.sha }}",
            "triggered_by": "${{ github.actor }}",
            "terraform_version": "${{ vars.TERRAFORM_VERSION }}",
            "recorded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          echo "Evidence header written to run-metadata.json"

      - name: Upload the validation evidence bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-validate-${{ github.run_id }}
          path: |
            validate.txt
            run-metadata.json
          retention-days: 14
          if-no-files-found: warn
