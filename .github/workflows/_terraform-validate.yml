name: Reusable — Terraform Validate

# Reusable fmt + validate. Called by terraform-plan-pr.yml as its first job, so a
# pull request produces ONE run containing every check rather than two separate
# runs to read.
#
# It is NOT redundant with the plan jobs, even though those also run validate.
# In _terraform-plan.yml the validate step is guarded by the state-backend check,
# so for any environment that has not been bootstrapped the plan job SKIPS it.
# With no backends provisioned, this is the only thing validating the code at all
# -- which is exactly why the plan jobs depend on it rather than running beside
# it: a syntax error should stop them, not let them report a green skip.
#
# Deliberately needs NO Azure credentials and NO state access:
# "terraform init -backend=false" is enough for validate, so it is safe on a
# branch opened by someone without deployment rights, and it finishes in seconds.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Terraform format
        id: fmt
        run: |
          if terraform fmt -check -recursive; then
            echo "All files are correctly formatted."
          else
            echo "::error::Formatting issues above. Run 'terraform fmt -recursive' and commit."
            exit 1
          fi

      # Each root is validated separately. -backend=false skips backend setup,
      # which validate does not need -- so no credentials and no state are
      # touched. Modules are validated through the roots that call them.
      - name: Terraform validate
        run: |
          set -uo pipefail
          FAILED=0
          for dir in environments/dev environments/test environments/prod bootstrap/state baytex-bi-owned-unity-catalog-example; do
            [ -d "$dir" ] || continue
            echo "::group::validate $dir"
            if terraform -chdir="$dir" init -backend=false -input=false >/dev/null 2>&1 \
               && terraform -chdir="$dir" validate -no-color; then
              echo "  OK"
            else
              echo "::error::terraform validate failed in $dir"
              terraform -chdir="$dir" validate -no-color || true
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED

      # head_ref, not ref_name: on a pull_request event ref_name is "<number>/merge",
      # which tells a reviewer nothing. head_ref is the source branch.
      - name: Summary
        if: always()
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          {
            echo "### Terraform fmt and validate"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "Passed on \`$BRANCH\`."
            else
              echo "Failures above on \`$BRANCH\`. Run \`terraform fmt -recursive\` for formatting,"
              echo "and fix any validate errors, then push again — the plan jobs wait on this."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
