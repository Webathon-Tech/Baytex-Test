name: Terraform Bootstrap State Backend

# Creates the Azure Blob backend that every other pipeline stores its state in,
# then moves this root's OWN state into that backend.
#
# Split into PLAN and APPLY, the same shape as terraform-deploy.yml, because this
# is the one root where a careless change is unrecoverable: the storage account
# it manages *holds the state for every environment*. A change that forces
# replacement of that account would destroy the state it is tracked in. A
# reviewer must see the plan before anything is applied.
#
# The chicken-and-egg: Terraform cannot keep state in a storage account that does
# not exist yet. So the first run uses local state, creates the account, then
# migrates. Every later run inits straight against the remote backend.
#
# Re-running must never destroy or orphan state, so the job branches on what is
# actually present -- and specifically on the STATE BLOB, not just the storage
# account. If a previous run created the account but died before migrating,
# checking only the account would send us down the "remote" path against an empty
# backend, and Terraform would try to create a storage account whose name is
# already taken. Importing instead recovers cleanly.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose state backend to create
        required: true
        type: choice
        options: [dev, test, prod, all]

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-bootstrap-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.1"
  ARM_USE_AZUREAD: "true"

jobs:
  # Turns the single choice into a list, so "all" fans out to three matrix legs
  # instead of needing a separate workflow or three copies of the job.
  resolve:
    name: Resolve environments
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.set.outputs.environments }}
    steps:
      # This workflow runs "terraform apply" -- it creates the state storage
      # account -- so it gets the same branch restriction as every other apply
      # path. Checked here so it fails before any Azure work and before the
      # matrix fans out.
      - name: Restrict to main or a hotfix branch
        run: |
          REF="${{ github.ref }}"
          case "$REF" in
            refs/heads/main|refs/heads/hotfix/*)
              echo "Bootstrapping from $REF" ;;
            *)
              echo "::error::Refusing to bootstrap from '$REF'. This workflow applies Terraform; it runs from main, or from a hotfix/* branch."
              exit 1 ;;
          esac

      - id: set
        run: |
          if [ "${{ inputs.environment }}" = "all" ]; then
            echo 'environments=["dev","test","prod"]' >> "$GITHUB_OUTPUT"
          else
            echo 'environments=["${{ inputs.environment }}"]' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # ==========================================================================
  # PLAN -- runs in <env>-plan, no approval, produces the artefact to review
  # ==========================================================================
  plan:
    name: Plan ${{ matrix.environment }} state backend
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.resolve.outputs.environments) }}
    environment: ${{ matrix.environment }}-plan
    defaults:
      run:
        shell: bash
        working-directory: bootstrap/state

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform format
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Write bootstrap variables
        env:
          # Same pattern as the platform workflows: the whole tfvars file lives in
          # a per-environment GitHub variable. Nothing about the environment --
          # not the region, not the account name -- is hardcoded in this YAML.
          #
          # TESTING ONLY: read from a VARIABLE so the content is visible in the
          # GitHub UI. Variables are not masked in logs; switch to the secret
          # line before any client deployment.
          # BOOTSTRAP_TFVARS: ${{ secrets.BOOTSTRAP_TFVARS }}
          BOOTSTRAP_TFVARS: ${{ vars.BOOTSTRAP_TFVARS }}
        run: |
          test -n "$BOOTSTRAP_TFVARS" || {
            echo "::error::BOOTSTRAP_TFVARS is empty for ${{ matrix.environment }}. Set it on that GitHub Environment - see GITHUB-SETUP.md."
            exit 1
          }
          printf '%s\n' "$BOOTSTRAP_TFVARS" > terraform.tfvars
          terraform fmt terraform.tfvars

      # The resources come from BOOTSTRAP_TFVARS; the backend-config below comes
      # from TF_STATE_*. Two sources for the same three facts, so they can drift
      # -- and if they do, this pipeline creates one storage account and then
      # tries to store its state in a different one. Cross-check rather than
      # trusting whoever set the variables.
      - name: Check tfvars agrees with the backend variables
        env:
          STATE_RG: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
        run: |
          set -euo pipefail
          val () { grep -E "^[[:space:]]*$1[[:space:]]*=" terraform.tfvars | head -1 | sed 's/.*=[[:space:]]*//; s/^"//; s/"[[:space:]]*$//'; }
          RG=$(val resource_group_name); SA=$(val storage_account_name); CN=$(val container_name)
          FAIL=0
          check () {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 mismatch — BOOTSTRAP_TFVARS says '$2', TF_STATE_* says '$3'"
              FAIL=1
            else
              printf '  %-22s %s\n' "$1" "$2"
            fi
          }
          check resource_group_name  "$RG" "$STATE_RG"
          check storage_account_name "$SA" "$STATE_SA"
          check container_name       "$CN" "$STATE_CONTAINER"
          [ "$FAIL" -eq 0 ] || { echo "::error::Fix the variables on this environment before bootstrapping."; exit 1; }
          echo "tfvars and backend variables agree."

      - name: Determine current backend state
        id: probe
        env:
          STATE_RG: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
        run: |
          set -euo pipefail
          STATE_KEY="bootstrap/${{ matrix.environment }}.tfstate"

          if az storage account show --name "$STATE_SA" --resource-group "$STATE_RG" --only-show-errors >/dev/null 2>&1; then
            ACCOUNT_EXISTS=true
          else
            ACCOUNT_EXISTS=false
          fi

          BLOB_EXISTS=false
          if [ "$ACCOUNT_EXISTS" = "true" ]; then
            if az storage blob exists --account-name "$STATE_SA" --container-name "$STATE_CONTAINER" \
                 --name "$STATE_KEY" --auth-mode login --only-show-errors \
                 --query exists -o tsv 2>/dev/null | grep -qi true; then
              BLOB_EXISTS=true
            fi
          fi

          if [ "$BLOB_EXISTS" = "true" ]; then MODE=remote
          elif [ "$ACCOUNT_EXISTS" = "true" ]; then MODE=import
          else MODE=create
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "state_key=$STATE_KEY" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$MODE" > mode.txt
          printf '%s\n' "$STATE_KEY" > state_key.txt
          echo "Storage account exists : $ACCOUNT_EXISTS"
          echo "State blob exists      : $BLOB_EXISTS"
          echo "Mode                   : $MODE"

      # remote: the backend exists and is tracked. This is the DANGEROUS case --
      # real state is at stake -- so it gets a proper binary plan that the apply
      # job consumes byte for byte.
      - name: Init against existing backend
        if: steps.probe.outputs.mode == 'remote'
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ steps.probe.outputs.state_key }}" \
            -backend-config="use_azuread_auth=true"

      # create: nothing exists yet, so there is no state to lose. backend.tf must
      # be moved ASIDE rather than left uninitialised -- "-backend=false" skips
      # backend setup but the azurerm block is still declared, and plan refuses
      # with "Backend initialization required".
      - name: Disable backend block for local-state plan
        if: steps.probe.outputs.mode != 'remote'
        run: mv backend.tf ../backend.tf.disabled

      - name: Init with local state
        if: steps.probe.outputs.mode != 'remote'
        run: terraform init

      - name: Terraform plan
        run: |
          terraform plan -lock-timeout=10m -out=bootstrap.tfplan
          terraform show -no-color bootstrap.tfplan > plan.txt
          grep -E '^(Plan:|No changes)' plan.txt || true

      # The whole point of the split: put the numbers where a reviewer sees them
      # before approving, and shout if anything is being destroyed or replaced.
      - name: Summarise for the approver
        run: |
          MODE="${{ steps.probe.outputs.mode }}"
          {
            echo "### ${{ matrix.environment }} state backend — plan (mode: \`$MODE\`)"
            echo ""
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || tail -n 3 plan.txt
            echo '```'
            echo ""
            if grep -qE 'must be replaced|will be destroyed' plan.txt; then
              echo "> **STOP AND READ THE PLAN.** This changes or removes the storage account"
              echo "> that holds Terraform state for this environment. Approving it can"
              echo "> destroy the state file. Confirm this is intended before approving."
              echo ""
              grep -E '^  # .*(must be replaced|will be destroyed)' plan.txt | sed 's/^/    /'
            else
              echo "No replacements or destroys in this plan."
            fi
            if [ "$MODE" = "import" ]; then
              echo ""
              echo "> Mode \`import\`: the storage account exists but nothing tracks it."
              echo "> The apply job imports the resource group, account and container into"
              echo "> state first, then applies. The plan above is pre-import, so it shows"
              echo "> creates for resources that already exist — that is expected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan for approval
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-plan-${{ matrix.environment }}-${{ github.run_id }}
          path: |
            bootstrap/state/bootstrap.tfplan
            bootstrap/state/plan.txt
            bootstrap/state/mode.txt
            bootstrap/state/state_key.txt
            bootstrap/state/.terraform.lock.hcl
          retention-days: 5
          if-no-files-found: error

  # ==========================================================================
  # APPLY -- runs in <env>-apply. Attach required reviewers there and this
  # pauses until somebody has read the plan above.
  # ==========================================================================
  apply:
    name: Apply ${{ matrix.environment }} state backend
    needs: [resolve, plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.resolve.outputs.environments) }}
    environment: ${{ matrix.environment }}-apply
    defaults:
      run:
        shell: bash
        working-directory: bootstrap/state

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Write bootstrap variables
        env:
          # Same pattern as the platform workflows: the whole tfvars file lives in
          # a per-environment GitHub variable. Nothing about the environment --
          # not the region, not the account name -- is hardcoded in this YAML.
          #
          # TESTING ONLY: read from a VARIABLE so the content is visible in the
          # GitHub UI. Variables are not masked in logs; switch to the secret
          # line before any client deployment.
          # BOOTSTRAP_TFVARS: ${{ secrets.BOOTSTRAP_TFVARS }}
          BOOTSTRAP_TFVARS: ${{ vars.BOOTSTRAP_TFVARS }}
        run: |
          test -n "$BOOTSTRAP_TFVARS" || {
            echo "::error::BOOTSTRAP_TFVARS is empty for ${{ matrix.environment }}. Set it on that GitHub Environment - see GITHUB-SETUP.md."
            exit 1
          }
          printf '%s\n' "$BOOTSTRAP_TFVARS" > terraform.tfvars
          terraform fmt terraform.tfvars

      # The resources come from BOOTSTRAP_TFVARS; the backend-config below comes
      # from TF_STATE_*. Two sources for the same three facts, so they can drift
      # -- and if they do, this pipeline creates one storage account and then
      # tries to store its state in a different one. Cross-check rather than
      # trusting whoever set the variables.
      - name: Check tfvars agrees with the backend variables
        env:
          STATE_RG: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
        run: |
          set -euo pipefail
          val () { grep -E "^[[:space:]]*$1[[:space:]]*=" terraform.tfvars | head -1 | sed 's/.*=[[:space:]]*//; s/^"//; s/"[[:space:]]*$//'; }
          RG=$(val resource_group_name); SA=$(val storage_account_name); CN=$(val container_name)
          FAIL=0
          check () {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 mismatch — BOOTSTRAP_TFVARS says '$2', TF_STATE_* says '$3'"
              FAIL=1
            else
              printf '  %-22s %s\n' "$1" "$2"
            fi
          }
          check resource_group_name  "$RG" "$STATE_RG"
          check storage_account_name "$SA" "$STATE_SA"
          check container_name       "$CN" "$STATE_CONTAINER"
          [ "$FAIL" -eq 0 ] || { echo "::error::Fix the variables on this environment before bootstrapping."; exit 1; }
          echo "tfvars and backend variables agree."

      - name: Download the approved plan
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-plan-${{ matrix.environment }}-${{ github.run_id }}
          path: bootstrap/state

      - name: Read the mode the plan was built for
        id: mode
        run: |
          set -euo pipefail
          test -f mode.txt || { echo "::error::mode.txt missing from artefact"; exit 1; }
          test -f bootstrap.tfplan || { echo "::error::bootstrap.tfplan missing from artefact"; exit 1; }
          MODE=$(tr -d '\r\n' < mode.txt)
          KEY=$(tr -d '\r\n' < state_key.txt)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "state_key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Applying mode '$MODE' with state key '$KEY'"

      # ---------------------------------------------------------------- remote
      - name: Init against existing backend
        if: steps.mode.outputs.mode == 'remote'
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ steps.mode.outputs.state_key }}" \
            -backend-config="use_azuread_auth=true"

      # ------------------------------------------------------- create / import
      - name: Disable backend block for local-state phase
        if: steps.mode.outputs.mode != 'remote'
        run: mv backend.tf ../backend.tf.disabled

      - name: Init with local state
        if: steps.mode.outputs.mode != 'remote'
        run: terraform init

      # Import is a STATE operation, not something a plan can carry, so it has to
      # happen here. The reviewer saw a pre-import plan and the summary said so.
      - name: Import pre-existing backend resources
        if: steps.mode.outputs.mode == 'import'
        env:
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          STATE_RG: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
        run: |
          set -euo pipefail
          RG_ID="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$STATE_RG"
          SA_ID="$RG_ID/providers/Microsoft.Storage/storageAccounts/$STATE_SA"
          CONTAINER_ID="$SA_ID/blobServices/default/containers/$STATE_CONTAINER"

          terraform import azurerm_resource_group.state "$RG_ID" || echo "resource group already tracked"
          terraform import azurerm_storage_account.state "$SA_ID" || echo "storage account already tracked"
          terraform import azapi_resource.state_container "$CONTAINER_ID?api-version=2023-05-01" || echo "container already tracked"

          # The saved plan is pre-import and no longer matches state, so re-plan.
          # Safe: the reviewer has already approved this environment's bootstrap,
          # and the next step asserts the result converges.
          terraform plan -lock-timeout=10m -out=bootstrap.tfplan

      - name: Apply the approved plan
        run: terraform apply -lock-timeout=10m -auto-approve bootstrap.tfplan

      # --------------------------------------------------------------- migrate
      - name: Restore backend block
        if: steps.mode.outputs.mode != 'remote'
        run: mv ../backend.tf.disabled backend.tf

      - name: Migrate local state into the backend
        if: steps.mode.outputs.mode != 'remote'
        run: |
          terraform init -migrate-state -force-copy \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ steps.mode.outputs.state_key }}" \
            -backend-config="use_azuread_auth=true"

      # ------------------------------------------------------------ reconcile
      - name: Confirm state is remote and clean
        run: |
          set -euo pipefail
          echo "Resources tracked in remote state:"
          terraform state list

          # A clean re-run must be a no-op. -detailed-exitcode: 0 = no changes,
          # 2 = changes pending, 1 = error. Anything but 0 means this pipeline is
          # not idempotent and would drift on the next run.
          set +e
          terraform plan -detailed-exitcode -lock-timeout=10m > /dev/null 2>&1
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ]; then
            echo "::error::Backend is not idempotent - re-running would still show changes (exit $CODE)"
            terraform plan -no-color
            exit 1
          fi
          echo "Idempotency confirmed: a re-run produces no changes."

      - name: Backend configuration for the platform pipelines
        run: |
          {
            echo "### ${{ matrix.environment }} state backend ready"
            echo ""
            echo '```hcl'
            echo 'resource_group_name  = "${{ vars.TF_STATE_RESOURCE_GROUP }}"'
            echo 'storage_account_name = "${{ vars.TF_STATE_STORAGE_ACCOUNT }}"'
            echo 'container_name       = "${{ vars.TF_STATE_CONTAINER }}"'
            echo 'key                  = "${{ vars.TF_STATE_KEY }}"'
            echo 'use_azuread_auth     = true'
            echo '```'
            echo ""
            echo "Bootstrap state key: \`${{ steps.mode.outputs.state_key }}\`"
            echo "Mode applied:        \`${{ steps.mode.outputs.mode }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
