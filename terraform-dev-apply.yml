name: Terraform DEV Apply

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.15.9"
  DATABRICKS_TF_ENABLED_PF_RESOURCES: "databricks_mws_ncc_private_endpoint_rule"

jobs:
  plan:
    name: Create DEV apply plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev-plan
    defaults:
      run:
        shell: bash
        working-directory: environments/dev

    steps:
      - name: Checkout approved main commit
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Write DEV variables
        env:
          DEV_TFVARS: ${{ secrets.DEV_TFVARS }}
        run: |
          test -n "$DEV_TFVARS"
          printf '%s\n' "$DEV_TFVARS" > terraform.tfvars

      - name: Terraform format
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform validate
        run: terraform validate

      - name: Create exact apply plan
        run: terraform plan -lock-timeout=10m -out=tfplan

      - name: Render plan for approval
        run: terraform show -no-color tfplan | tee dev-plan.txt

      - name: Upload exact plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-exact-plan-${{ github.run_id }}-${{ github.sha }}
          path: |
            environments/dev/tfplan
            environments/dev/dev-plan.txt
            environments/dev/.terraform.lock.hcl
          retention-days: 3
          if-no-files-found: error

  apply:
    name: Approve and apply exact DEV plan
    needs: plan
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        shell: bash
        working-directory: environments/dev

    steps:
      - name: Checkout the same main commit
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Write DEV variables
        env:
          DEV_TFVARS: ${{ secrets.DEV_TFVARS }}
        run: |
          test -n "$DEV_TFVARS"
          printf '%s\n' "$DEV_TFVARS" > terraform.tfvars

      - name: Download approved exact plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-dev-exact-plan-${{ github.run_id }}-${{ github.sha }}
          path: environments/dev

      - name: Terraform init using the reviewed lock file
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="use_azuread_auth=true"

      - name: Verify plan provenance
        run: |
          test -f tfplan
          test -f dev-plan.txt
          test -f .terraform.lock.hcl
          git diff --exit-code

      - name: Apply exact approved plan
        run: terraform apply -lock-timeout=10m -auto-approve tfplan

      - name: Export outputs
        run: terraform output -json > dev-outputs.json

      - name: Upload apply evidence
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-apply-${{ github.sha }}
          path: |
            environments/dev/dev-outputs.json
            environments/dev/dev-plan.txt
          retention-days: 30
