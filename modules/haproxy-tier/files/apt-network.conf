// Installed by cloud-init from the haproxy-tier Terraform module.
// The proxy subnet has no IPv6 route and reaches the package mirrors through the firewall, so apt connects over IPv4 and
// moves on from an unreachable mirror quickly. baytex-haproxy-reconcile retries the installation on its next run.
Acquire::ForceIPv4 "true";
Acquire::http::Timeout "30";
Acquire::https::Timeout "30";
Acquire::Retries "2";
