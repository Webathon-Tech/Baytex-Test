name: Terraform DEV Plan

on:
  pull_request:
    paths:
      - "environments/dev/**"
      - "modules/**"
      - ".github/workflows/terraform-dev-*.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.15.9"
  DATABRICKS_TF_ENABLED_PF_RESOURCES: "databricks_mws_ncc_private_endpoint_rule"

jobs:
  plan:
    name: Validate and plan DEV
    runs-on: ubuntu-latest
    environment: dev-plan
    defaults:
      run:
        shell: bash
        working-directory: environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Write DEV variables
        env:
          DEV_TFVARS: ${{ secrets.DEV_TFVARS }}
        run: |
          test -n "$DEV_TFVARS"
          printf '%s\n' "$DEV_TFVARS" > terraform.tfvars

      - name: Terraform format
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -lock-timeout=10m -out=tfplan

      - name: Render plan
        run: terraform show -no-color tfplan > dev-plan.txt

      - name: Upload plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan-${{ github.sha }}
          path: |
            environments/dev/dev-plan.txt
            environments/dev/.terraform.lock.hcl
          retention-days: 14
